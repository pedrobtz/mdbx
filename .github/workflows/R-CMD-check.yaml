# R CMD check, on the GitHub runners and in the two CRAN-like containers.
# The reusable workflow carries the reasoning; this file carries only what is
# specific to this package.
#
# The container half is not decoration here. This package compiles a vendored
# C library, and CRAN's Debian clang leg -- clang 23 building C as -std=gnu23
# -- is the only configuration in the world that reported the C23
# keyword-macro warnings in it. It reported them from an incoming pretest
# rather than from CI, because no GitHub runner is that combination: GCC has
# no -Wkeyword-macro diagnostic at all, and the macOS runner's clang still
# defaults to __STDC_VERSION__ 201710L. See
# tools/patches/0005-c23-keyword-macros.patch.
#
# No paths-ignore, unlike native-checks.yaml: --as-cran checks the URLs in
# README.md, which ships in the tarball, so a prose-only change is a real
# change here.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # gs+qpdf shrinks the vignette PDFs, which --as-cran NOTEs otherwise.
      # Reaches the runners only; the container images have neither tool.
      build-args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
