# Native-code checks for the C/C++ sources: sanitizers (ASan/UBSan), valgrind,
# LTO, gctorture, and rchk, via the reusable workflows in pedrobtz/r-actions.
#
# All five are called as-is.
#
# paths-ignore skips the whole workflow for prose-only changes. These jobs
# compile the package and run the suite, so nothing they can observe lives in
# a .md file, a pkgdown article or .agents/. GitHub applies it only when every
# changed file matches, so a commit touching both a vignette and src/ still
# runs. man/ is deliberately absent: R CMD check executes the examples in it,
# and valgrind is what runs them under instrumentation. R-CMD-check.yaml is
# also left alone -- README.md ships in the tarball and --as-cran checks the
# URLs in it, which is a real check on a prose-only change.
#
# YAML anchors would express this once; GitHub Actions does not support them.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: native-checks

permissions: read-all

jobs:
  # UBSan on a runner (clang, the whole `undefined` group, halt_on_error), plus
  # the R-hub clang-asan and gcc-asan containers. Between them these are
  # CRAN's clang-UBSAN and gcc-UBSAN flavors: gcc-asan compiles with
  # -fsanitize=address,undefined,bounds-strict from its own Makeconf, and
  # bounds-strict is the one that sees libmdbx's trailing-array struct hacks.
  #
  # This used to be a local copy of the job with -fno-sanitize=alignment on
  # CFLAGS, because libmdbx dereferenced misaligned pointers. That hid exactly
  # what CRAN then reported against 0.1.0. The alignment reports are fixed at
  # the source now (MDBX_UNALIGNED_OK=0 in src/Makevars, tools/patches/0006 for
  # bounds-strict), so nothing here is relaxed any more.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true

  # Two things this job is the home of.
  #
  # Shuffled order: testthat loads helper-*.R before any test file, but a
  # helper defined at the top of an ordinary test file only exists once that
  # file has been sourced -- which under shuffle = TRUE may be after a test
  # that calls it. Every shared fixture lives in a helper file for that reason,
  # and a run in file order would never notice one moving back.
  #
  # The generated sequences: test-state-machine*.R is skip_on_cran(), because
  # this package's limits vary by page size and a generated sequence that walks
  # into a boundary could fail on one CRAN machine alone. NOT_CRAN is therefore
  # set explicitly here rather than left to another action's default, so the
  # state machine has one job it is guaranteed to run in.
  shuffled-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Run the test suite in shuffled order
        shell: Rscript {0}
        run: |
          # Several seeds: one shuffle only samples one order, and an order
          # dependence between two particular files can survive it.
          for (seed in c(1, 20260913, 99)) {
            set.seed(seed)
            message("--- shuffled run, seed ", seed, " ---")
            devtools::test(shuffle = TRUE, stop_on_failure = TRUE)
          }

  # CRAN's valgrind check, as closely as a GitHub runner allows. The settings
  # are the ones in https://www.stats.ox.ac.uk/pub/bdr/memtests/README.txt
  # and in the logs it publishes: valgrind 3.27.1, --leak-check=full and
  # --track-origins=yes, R CMD check --use-valgrind, so examples as well as
  # tests -- and no suppression file, because CRAN runs without one.
  #
  # Local rather than r-actions' valgrind.yml, for two reasons that are both
  # about matching CRAN, not about this package:
  #
  # * valgrind is built from source at CRAN's version. Ubuntu's is 3.22, and
  #   the leg it ran was green while CRAN's 3.27.1 run of 0.1.1 was not.
  # * tools/valgrind/fake-ram.c is preloaded so that sysconf() reports
  #   FAKE_RAM_GB of physical memory. libmdbx sizes its default upper
  #   geometry at about 1.6x RAM, so on a 16 GB runner a default open asks
  #   valgrind to map ~20 GB, which it can; on CRAN's machine it asked for far
  #   more, valgrind's mmap() refused with EINVAL, and every example and test
  #   using the default geometry failed (issue #30). 256 GB stands in for a
  #   machine of that class.
  #
  # One deliberate difference from CRAN: possibly-lost blocks are shown but do
  # not count as errors. libmdbx keeps its page-number lists by interior
  # pointer, so an environment still open when a process exits -- a forked
  # child of test-fork.R, which must not close what it inherited -- reports its
  # lists as "possibly lost". Everything else counts.
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VALGRIND_VERSION: "3.27.1"
      FAKE_RAM_GB: "256"

    steps:
      - uses: actions/checkout@v4

      - name: Cache valgrind
        id: cache-valgrind
        uses: actions/cache@v4
        with:
          path: ~/valgrind
          key: valgrind-${{ env.VALGRIND_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build valgrind ${{ env.VALGRIND_VERSION }}
        if: steps.cache-valgrind.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://sourceware.org/pub/valgrind/valgrind-${VALGRIND_VERSION}.tar.bz2" | tar -xj -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/valgrind-${VALGRIND_VERSION}"
          ./configure --prefix="$HOME/valgrind" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null

      # valgrind must redirect memcmp in ld.so, and finds it only through
      # glibc's debug symbols; without them it refuses to start at all.
      - name: Put valgrind on PATH and build the RAM shim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-dbg > /dev/null
          echo "$HOME/valgrind/bin" >> "$GITHUB_PATH"
          cc -shared -fPIC -O2 -o "$RUNNER_TEMP/fake-ram.so" tools/valgrind/fake-ram.c -ldl
          echo "FAKE_RAM_SO=$RUNNER_TEMP/fake-ram.so" >> "$GITHUB_ENV"
          "$HOME/valgrind/bin/valgrind" --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The fastest evidence there is: one default-geometry open under
      # valgrind, before the check spends half an hour getting to one.
      - name: Probe a default-geometry open under valgrind
        run: |
          R CMD INSTALL . > /dev/null
          cat > "$RUNNER_TEMP/probe.R" <<'EOF'
          library(mdbx)
          for (map_size in list(NULL, 8 * 1024^2)) {
            label <- if (is.null(map_size)) "default" else "8 MB"
            res <- tryCatch({
              env <- mdbx_env_open(tempfile(), map_size = map_size)
              on.exit(mdbx_env_close(env))
              sprintf("ok, geo_upper = %.1f GB", mdbx_env_info(env)$geo_upper / 1024^3)
            }, error = conditionMessage)
            cat(sprintf("map_size %-8s %s\n", label, res))
          }
          EOF
          echo "--- without valgrind"
          LD_PRELOAD="$FAKE_RAM_SO" Rscript "$RUNNER_TEMP/probe.R"
          echo "--- under valgrind"
          LD_PRELOAD="$FAKE_RAM_SO" R -d valgrind --vanilla -q -f "$RUNNER_TEMP/probe.R" 2>&1 | grep -v '^==' || true

      # VALGRIND_OPTS is read by valgrind itself, so it reaches every valgrind
      # R CMD check starts. LD_PRELOAD reaches them the same way: valgrind
      # passes it on to the program it runs, alongside its own preloads.
      - name: R CMD check --use-valgrind
        shell: Rscript {0}
        # NOT_CRAN=false, as on CRAN: setup-r sets it true, which would run
        # the skip_on_cran() state-machine suites under valgrind as well.
        env:
          NOT_CRAN: "false"
          VALGRIND_OPTS: >-
            --leak-check=full --track-origins=yes --num-callers=30
            --errors-for-leak-kinds=definite,indirect
        run: |
          Sys.setenv(LD_PRELOAD = Sys.getenv("FAKE_RAM_SO"))
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--use-valgrind"),
            build_args = c("--no-manual"),
            check_dir = "check",
            error_on = "warning"
          )

      # R CMD check does not fail on a valgrind finding: they land in the
      # .Rout files, which check reads for R errors only. So grep them.
      # "ERROR SUMMARY: 0 errors" is the ordinary line and must not match.
      - name: Scan for valgrind findings
        if: always()
        run: |
          set -eu
          logs=$(find check -name '*.Rout' -o -name '*.Rout.fail' 2>/dev/null || true)
          if [ -z "$logs" ]; then
            echo "No check output to scan." >&2
            exit 1
          fi
          echo "possibly-lost records (reported, not counted):"
          grep -hE 'are possibly lost in loss record' $logs | sed 's/^==[0-9]*== //' | sort | uniq -c || true
          # "valgrind: " opens valgrind's own fatal messages, such as failing
          # to start -- which otherwise leaves nothing else here to match.
          pattern='^valgrind: |ERROR SUMMARY: [1-9]|definitely lost: [1-9]|indirectly lost: [1-9]|are definitely lost in loss record|Invalid read|Invalid write|Invalid free|Mismatched free|uninitialised|Conditional jump or move depends|Syscall param'
          hits=$(grep -lE "$pattern" $logs || true)
          if [ -n "$hits" ]; then
            for f in $hits; do
              echo "----------------------------------------------------------"
              echo "$f"
              echo "----------------------------------------------------------"
              grep -E -A 16 "$pattern" "$f" || true
            done
            echo "::error::valgrind reported a memory error or leak"
            exit 1
          fi
          echo "valgrind reported no errors or leaks."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-check
          path: check
          if-no-files-found: ignore

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # step 100 rather than the default 20: cost scales as roughly 1/step, and at
  # 20 this suite took 49 to 61 minutes. Every path still runs and the suite
  # still forces many thousands of collections -- what a larger step gives up
  # is the odds that one lands while a given unprotected SEXP is live. rchk
  # covers the same class statically, on every push, in a minute.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 100

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  # CRAN's rcnst, rlibro and vnu checks -- the "Additional issues" nothing
  # above reproduces. Full runs only: `quick`, which skips all three, on
  # pull requests; full on the push to main.
  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
