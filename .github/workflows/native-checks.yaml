# Native-code checks for the C/C++ sources: sanitizers (ASan/UBSan), valgrind,
# LTO, gctorture, and rchk, via the reusable workflows in pedrobtz/r-actions.
#
# Four of the five are called as-is. Sanitizers are run from a local job instead
# because this package needs one flag the reusable workflow does not take: see
# the comment on CFLAGS below.
on:
  push:
    branches: [main, master]
  pull_request:

name: native-checks

permissions: read-all

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CC: clang
      CXX: clang++

      # -fno-sanitize=alignment applies to CFLAGS only, and vendor/libmdbx/mdbx.c
      # is the only C file in the package -- so this relaxes exactly the vendored
      # amalgamation and leaves every first-party source fully checked.
      #
      # libmdbx does deliberate unaligned access, gated on its own compile-time
      # MDBX_UNALIGNED_OK; `unaligned_poke_u32` (mdbx.c:647) is a plain
      # `*(uint32_t *)ptr = v` that is correct on every platform this package
      # builds for and undefined by the letter of the standard. Verified locally:
      # one UBSan site, zero once alignment is excluded, with all other UBSan
      # checks still active.
      CFLAGS: -g -O1 -fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer
      CXXFLAGS: -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:strict_init_order=1

      # halt_on_error is not UBSan's default: without it a diagnostic is printed
      # and execution continues, so R CMD check would pass with sanitizer errors
      # buried in the test log.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check with sanitizers
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )

  # Two things this job is the home of.
  #
  # Shuffled order: testthat loads helper-*.R before any test file, but a
  # helper defined at the top of an ordinary test file only exists once that
  # file has been sourced -- which under shuffle = TRUE may be after a test
  # that calls it. Every shared fixture lives in a helper file for that reason,
  # and a run in file order would never notice one moving back.
  #
  # The generated sequences: test-state-machine*.R is skip_on_cran(), because
  # this package's limits vary by page size and a generated sequence that walks
  # into a boundary could fail on one CRAN machine alone. NOT_CRAN is therefore
  # set explicitly here rather than left to another action's default, so the
  # state machine has one job it is guaranteed to run in.
  shuffled-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Run the test suite in shuffled order
        shell: Rscript {0}
        run: |
          # Several seeds: one shuffle only samples one order, and an order
          # dependence between two particular files can survive it.
          for (seed in c(1, 20260913, 99)) {
            set.seed(seed)
            message("--- shuffled run, seed ", seed, " ---")
            devtools::test(shuffle = TRUE, stop_on_failure = TRUE)
          }

  # Pinned to a branch of r-actions (PR pedrobtz/r-actions#8) rather than @v1
  # until that lands and v1 moves. CI-only; nothing shipped changes.
  #
  # --leak-check=full because R's own --use-valgrind does not set it, so a
  # "definitely lost" total arrives with no stack and cannot be attributed.
  #
  # The suppression file covers exactly two established-benign classes, both
  # with their stacks recorded in tools/valgrind.supp: libmdbx writing page
  # padding it never initialised, and the MDBX_env/MDBX_txn this package
  # deliberately abandons after a libmdbx panic instead of re-entering a
  # library that has rejected its own invariants.
  #
  # -DENABLE_MEMCHECK was tried here and reverted. It is libmdbx's switch for
  # finding bugs *inside libmdbx*, not for annotating its padding away: it
  # raised the uninitialised-value contexts from 2 to 13, and it shrinks the
  # default geometry enough to fail the reservation test in test-env.R.
  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@6857cc37109b39743c492181d76e4600195cd743
    with:
      valgrind-opts: "--leak-check=full --track-origins=yes --show-leak-kinds=definite,indirect"
      suppressions: "tools/valgrind.supp"

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
