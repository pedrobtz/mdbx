# Native-code checks for the C/C++ sources: sanitizers (ASan/UBSan), valgrind,
# LTO, gctorture, and rchk, via the reusable workflows in pedrobtz/r-actions.
#
# All five are called as-is.
#
# paths-ignore skips the whole workflow for prose-only changes. These jobs
# compile the package and run the suite, so nothing they can observe lives in
# a .md file, a pkgdown article or .agents/. GitHub applies it only when every
# changed file matches, so a commit touching both a vignette and src/ still
# runs. man/ is deliberately absent: R CMD check executes the examples in it,
# and valgrind is what runs them under instrumentation. R-CMD-check.yaml is
# also left alone -- README.md ships in the tarball and --as-cran checks the
# URLs in it, which is a real check on a prose-only change.
#
# YAML anchors would express this once; GitHub Actions does not support them.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: native-checks

permissions: read-all

jobs:
  # UBSan on a runner (clang, the whole `undefined` group, halt_on_error), plus
  # the R-hub clang-asan and gcc-asan containers. Between them these are
  # CRAN's clang-UBSAN and gcc-UBSAN flavors: gcc-asan compiles with
  # -fsanitize=address,undefined,bounds-strict from its own Makeconf, and
  # bounds-strict is the one that sees libmdbx's trailing-array struct hacks.
  #
  # This used to be a local copy of the job with -fno-sanitize=alignment on
  # CFLAGS, because libmdbx dereferenced misaligned pointers. That hid exactly
  # what CRAN then reported against 0.1.0. The alignment reports are fixed at
  # the source now (MDBX_UNALIGNED_OK=0 in src/Makevars, tools/patches/0006 for
  # bounds-strict), so nothing here is relaxed any more.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true

  # Two things this job is the home of.
  #
  # Shuffled order: testthat loads helper-*.R before any test file, but a
  # helper defined at the top of an ordinary test file only exists once that
  # file has been sourced -- which under shuffle = TRUE may be after a test
  # that calls it. Every shared fixture lives in a helper file for that reason,
  # and a run in file order would never notice one moving back.
  #
  # The generated sequences: test-state-machine*.R is skip_on_cran(), because
  # this package's limits vary by page size and a generated sequence that walks
  # into a boundary could fail on one CRAN machine alone. NOT_CRAN is therefore
  # set explicitly here rather than left to another action's default, so the
  # state machine has one job it is guaranteed to run in.
  shuffled-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Run the test suite in shuffled order
        shell: Rscript {0}
        run: |
          # Several seeds: one shuffle only samples one order, and an order
          # dependence between two particular files can survive it.
          for (seed in c(1, 20260913, 99)) {
            set.seed(seed)
            message("--- shuffled run, seed ", seed, " ---")
            devtools::test(shuffle = TRUE, stop_on_failure = TRUE)
          }

  # --leak-check=full because R's own --use-valgrind does not set it, so a
  # "definitely lost" total arrives with no stack and cannot be attributed
  # from the artifact. Not --track-origins: it answers where an uninitialised
  # value came from, which was worth having while the page-padding findings
  # were being identified and is dead weight now that they are suppressed --
  # it took the job from 6 minutes to 15. Turning leak-check on also makes
  # every leak record an error,
  # and the default errors-for-leak-kinds counts "possibly lost" among them --
  # which here is libmdbx holding interior pointers into its own allocations,
  # not a leak, and is reported without a stack because it is not shown. So
  # the two kinds that are shown are the two that count.
  #
  # The suppression file covers exactly two established-benign classes, both
  # with their stacks recorded in tools/valgrind.supp: libmdbx writing page
  # padding it never initialised, and the MDBX_env/MDBX_txn this package
  # deliberately abandons after a libmdbx panic instead of re-entering a
  # library that has rejected its own invariants. tools/ is in .Rbuildignore,
  # so none of this reaches the tarball.
  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      valgrind-opts: >-
        --leak-check=full
        --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect
      suppressions: "tools/valgrind.supp"

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # step 100 rather than the default 20: cost scales as roughly 1/step, and at
  # 20 this suite took 49 to 61 minutes. Every path still runs and the suite
  # still forces many thousands of collections -- what a larger step gives up
  # is the odds that one lands while a given unprotected SEXP is live. rchk
  # covers the same class statically, on every push, in a minute.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 100

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
